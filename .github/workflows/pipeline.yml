
name: Pipeline CI/CD

on:
  push:
    branches:
      - main

jobs:
  preparacao:
    name: Job 1 - Preparação
    runs-on: ubuntu-latest
    steps:
      - name: Iniciar pipeline
        run: echo "Pipeline iniciado!"

  teste:
    name: Job 2 - Teste
    runs-on: ubuntu-latest
    needs: preparacao
    steps:
      - name: Executar testes
        run: |
          echo "Executando testes..."
          echo "Testes concluídos com sucesso!"

  finalizacao:
    name: Job 3 - Finalização
    runs-on: ubuntu-latest
    needs: teste
    steps:
      - name: Finalizar pipeline
        run: echo "Pipeline finalizado com sucesso!"
